<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BS Analyst · Análisis de equipo</title>
<style>
:root{--bg:#080b14;--c:#111728;--c2:#192238;--t:#f4f7ff;--m:#969fb8;--a:#f5c842;--g:#35d399;--r:#ff667d;--b:#61a5ff;--line:#26304a}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#1a2440 0,#080b14 38%,#080b14 100%);color:var(--t);font:14px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.modal-open{overflow:hidden}
button,select,input,textarea{background:#171f32;color:var(--t);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;transition:.15s ease}
button{cursor:pointer}button:hover{border-color:#6675a5;transform:translateY(-1px);box-shadow:0 6px 18px #0002}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button.p{background:linear-gradient(135deg,#ffd967,#eeb92f);color:#17120a;border:0;font-weight:800;box-shadow:0 8px 22px #eeb92f22}
header{height:70px;display:flex;flex-wrap:nowrap;gap:9px;align-items:center;padding:10px 22px;background:#0c1120cc;position:sticky;top:0;z-index:5;border-bottom:1px solid #202941;backdrop-filter:blur(16px)}
header h1{font-size:18px;letter-spacing:-.3px;margin:0 12px 0 0;white-space:nowrap;color:var(--a)}
header select{max-width:180px}
header .tag{border:1px solid #29385a;border-radius:999px;background:#11192b;padding:6px 10px;color:#bac4dc;white-space:nowrap}
nav{height:58px;display:flex;align-items:flex-end;gap:6px;padding:0 22px;overflow:auto;border-bottom:1px solid #1c2540;background:#090d18}
nav button{border:0;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;background:transparent;color:var(--m);font-weight:700;padding:17px 14px 14px}
nav button:hover{background:#11182a;box-shadow:none;transform:none}
nav button.on{color:var(--a);border-bottom-color:var(--a);background:linear-gradient(180deg,#1a203022,#ffd23f08)}
main{padding:24px 22px 48px;max-width:1180px;margin:auto}
.card{background:linear-gradient(145deg,#121828,#101524);border:1px solid #252f49;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 12px 32px #0003}h2{font-size:15px;letter-spacing:.1px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.row>*{flex:0 1 auto}
table{width:100%;border-collapse:collapse}td,th{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--m);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:#1a22352e}
.ic{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:7px}.ic.l{width:62px;height:62px}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{background:#171f32;border:1px solid #29334e;border-radius:12px;padding:12px 16px;min-width:126px}.kpi b{display:block;font-size:24px;letter-spacing:-.5px}
.w{color:var(--g)}.l{color:var(--r)}.m{color:var(--m)}.tag{background:#171f32;border:1px solid #29334e;border-radius:999px;padding:3px 8px;font-size:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:38px}.chips img{width:36px;height:36px;cursor:pointer;background:#171f32;border:1px solid #29334e;border-radius:9px}
.add{width:36px;height:36px;padding:0}.map{background:#171f32;border:1px solid #29334e;border-radius:12px;overflow:hidden}.map img{width:100%;height:118px;object-fit:contain;background:#0a0e18}
.map{cursor:pointer;transition:.18s ease}.map:hover{transform:translateY(-3px);border-color:#6876a4;box-shadow:0 14px 28px #0005}
.map-analysis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.map-analysis>div{background:#171f32;border:1px solid #29334e;border-radius:12px;padding:12px}.map-rank{display:flex;align-items:center;gap:7px;margin:7px 0}.map-rank b{margin-left:auto}
.map div{padding:8px 9px}.bar{height:6px;background:#2d3549;border-radius:999px;margin-top:7px}.bar i{display:block;height:100%;border-radius:999px}
.bar i.no-data{background:#59627a!important}.bar i.good{background:var(--g)!important}.bar i.bad{background:var(--r)!important}.bar i.mid{background:var(--a)!important}
.map-sheet{background:linear-gradient(145deg,#121a2b,#0f1523);border:1px solid #29334e;border-radius:16px;padding:18px;margin:12px 0}
.map-sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.map-sheet-head h2{font-size:21px;margin:0}.map-sheet-head .tag{font-weight:700}
.map-sheet-top{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:14px;align-items:start}
.map-sheet-summary,.map-picks-panel{background:#171f32;border:1px solid #29334e;border-radius:12px;padding:12px}
.map-sheet-image{width:100%;height:150px;object-fit:contain;background:#0b1020;border-radius:9px}
.map-sheet-summary h3,.map-picks-panel h3{margin:0 0 9px;font-size:13px}
.map-summary-lines{display:grid;gap:7px;margin-top:10px}.map-summary-lines>div{display:flex;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid #29334e}
.map-summary-lines b{font-variant-numeric:tabular-nums}
.map-summary-picks{display:grid;gap:6px;margin-top:9px}.map-summary-pick{display:flex;align-items:center;gap:6px;font-size:12px}
.map-summary-pick img{width:25px;height:25px;object-fit:contain}
.map-brawler-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px}
.map-brawler{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px;align-items:center;min-height:54px;padding:6px 8px;background:#101729;border:1px solid #29334e;border-radius:10px}
.map-brawler>img{width:36px;height:36px;object-fit:contain}
.map-brawler-name{font-size:11px;font-weight:750;line-height:1.15;white-space:nowrap}
.map-brawler-meta{font-size:9px;color:var(--m);margin-top:3px;white-space:nowrap}
.map-brawler-pct{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}
.pct-good{color:#35d399!important}.pct-mid{color:#f5c842!important}.pct-bad{color:#ff667d!important}.pct-none{color:#a1abc1!important}
.source-links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.source-link{display:inline-flex;align-items:center;gap:5px;border:1px solid #394562;border-radius:8px;padding:7px 10px;color:#c7d8ff;text-decoration:none;background:#171f32;font-weight:700}
.source-link:hover{border-color:var(--a);color:var(--a)}
.map-sheet-note{margin-top:10px;font-size:10px;color:var(--m)}
.ov{position:fixed;inset:0;background:#050711df;backdrop-filter:blur(10px);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none!important}
.ov>div{background:linear-gradient(145deg,#151d31,#101525);border:1px solid #394562;border-radius:16px;padding:18px;max-width:820px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 80px #0009}
.ov>div button[data-close]{min-width:40px}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}.bg button{padding:5px;font-size:10px;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.bg img{width:100%;height:52px;object-fit:contain;pointer-events:none}
.best{outline:2px solid var(--g)}.worst{outline:2px solid var(--r)}.ban{background:#ff667d13}
@media(max-width:700px){
 header{height:auto;min-height:64px;padding:8px;gap:6px;flex-wrap:wrap}
 header h1{width:100%;margin:0}
 header select{max-width:42%;flex:1}
 header button{padding:8px}
 header #sync-status{order:5;width:auto}
 nav{height:52px;position:sticky;top:64px;z-index:4;background:#090d18;padding:0 8px}
 nav button{padding:13px 11px 11px}
 main{padding:14px 8px 28px}
 .card{padding:12px;margin:10px 0}
 .row>*{max-width:100%}
 .row input{min-width:0}
 table{display:block;overflow-x:auto;white-space:nowrap}
 .ov{padding:8px}
 .map-sheet{padding:10px}.map-sheet-top{grid-template-columns:1fr}.map-brawler-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@page{size:A4 landscape;margin:8mm}
@media print{
 html,body{background:#fff!important;color:#101827!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header,nav,#ov,.map-print-actions{display:none!important}
 main{max-width:none;padding:0!important;margin:0!important}
 .map-sheet{margin:0;padding:0;border:0;border-radius:0;background:#fff!important;color:#101827!important;box-shadow:none}
 .map-sheet-head{margin-bottom:8px}.map-sheet-head h2,.map-sheet-summary h3,.map-picks-panel h3{color:#101827!important}
 .map-sheet-top{grid-template-columns:220px minmax(0,1fr);gap:9px}
 .map-sheet-summary,.map-picks-panel{background:#fff!important;color:#101827!important;border:1px solid #b8c0ce;padding:8px}
 .map-sheet-image{height:112px;background:#f1f3f6}
 .map-summary-lines>div{border-color:#d8dde5}.map-summary-lines .m,.map-brawler-meta,.map-sheet-note{color:#596579!important}
 .map-summary-pick{color:#101827!important}
 .map-brawler-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
 .map-brawler{min-height:44px;background:#fff!important;border-color:#d8dde5;padding:4px 5px;break-inside:avoid}
 .map-brawler-name{color:#101827!important}.map-brawler>img{width:30px;height:30px}
 .source-link{background:#fff;color:#34415a;border-color:#c5ccd7;padding:4px 7px;font-size:9px}
 .map-sheet-note{font-size:9px}
}
</style></head><body>
<header><h1>🏆 BS Analyst</h1>
<select id="ws"></select><button id="nw">+ Equipo</button><button id="rn">Renombrar</button><button id="dl">Eliminar</button>
<span style="flex:1"></span><span id="sync-status" class="tag">Conectando...</span><button id="ex">Exportar</button><button id="im">Importar</button><input type="file" id="fi" hidden accept=".json"></header>
<nav id="tabs"></nav><main id="view"></main><div id="ov" class="ov" hidden></div>
<script>
// ===== Pools competitivos oficiales de 2026: invierno y verano =====
const POOL={
"Bounty":["Shooting Star","Hideout","Layer Cake","Dry Season"],
"Heist":["Hot Potato","Safe Zone","Bridge Too Far","Pit Stop","Kaboom Canyon"],
"Hot Zone":["Ring of Fire","Open Business","Dueling Beetles"],
"Brawl Ball":["Super Beach","Pinhole Punt","Sneaky Fields","Triple Dribble","Pinball Dreams"],
"Gem Grab":["Hard Rock Mine","Double Swoosh","Deathcap Trap","Gem Fort","Crystal Arcade"],
"Knockout":["Goldarm Gulch","Belle's Rock","Out in the Open","New Horizons","Flaring Phoenix"]
};
const ES={"Bounty":"Caza Estelar","Heist":"Atraco","Hot Zone":"Zona Restringida","Brawl Ball":"Balón Brawl","Gem Grab":"Atrapagemas","Knockout":"Noqueo"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let S=JSON.parse(localStorage.getItem("bsa")||"null")||(()=>{const id=uid();return{active:id,teams:{[id]:{name:"Mi equipo",matches:[],builds:{}}}}})();
const SUPABASE_URL="https://epsqmbyoeqnxcfyrzbhi.supabase.co";
const SUPABASE_KEY="sb_publishable_JrXaeoEactIVQp6wlfIRsw_QfCTOTyl";
let syncStatus="Conectando...";
const setSyncStatus=(text)=>{syncStatus=text;const n=document.querySelector("#sync-status");if(n)n.textContent=text};
const syncHeaders=()=>({apikey:SUPABASE_KEY,"Content-Type":"application/json"});
const save=async()=>{
 localStorage.setItem("bsa",JSON.stringify(S));
 setSyncStatus("Guardando...");
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),10000);
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/app_data",{
   method:"POST",headers:{...syncHeaders(),"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({key:"shared_state",value:S,updated_at:new Date().toISOString()}),signal:c.signal
  });
  clearTimeout(timer);
  setSyncStatus(r.ok?"Guardado compartido":`Error Supabase (${r.status})`);
 }catch(e){clearTimeout(timer);setSyncStatus(e.name==="AbortError"?"Sin respuesta de Supabase":"Error al sincronizar")}
};
const T=()=>S.teams[S.active];
let BR=[],MP=[],tab="partidos",rivalSel="",draft={mine:[],theirs:[],myBans:[],theirBans:[]},bq="",mapFilter="todos",selectedMap="";
let scoutDraft={scoutMine:[],scoutTheirs:[],scoutMyBans:[],scoutTheirBans:[]},scoutPending=[],scoutTeamFilter="";
let scoutForm={date:new Date().toISOString().slice(0,10),event:"",team:"",opponent:"",map:POOL.Bounty[0],result:"1"};
const LIM={mine:3,theirs:3,myBans:5,theirBans:5,scoutMine:3,scoutTheirs:3,scoutMyBans:5,scoutTheirBans:5};
const brOf=n=>BR.find(b=>b.name===n),brImg=n=>{const b=brOf(n);return b?(b.imageUrl2||b.imageUrl):""};
const safeUrl=s=>{try{const u=new URL(String(s||""));return["https:","http:"].includes(u.protocol)?u.href:""}catch{return""}};
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const allowedMode=n=>["Bounty","Heist","Gem Grab","Brawl Ball","Knockout","Hot Zone"].includes(n);
const mapMode=n=>{const m=MP.find(m=>norm(m.name)===norm(n));return m?.gameMode?.name||modeOf(n)};
const excludedMode=n=>{const x=norm(n);return x.includes("5v5")||x.startsWith("kaiju")||x.includes("kaiju")||x.includes("supervivencia")||x.includes("survival")||x.includes("showdown")};
const mapImg=n=>{const m=MP.find(m=>norm(m.name)===norm(n)&&m.imageUrl);return m?m.imageUrl:""};
const modeOf=n=>{for(const k in POOL)if(POOL[k].includes(n))return k;const m=MP.find(m=>m.name===n);return m?.gameMode?.name||"?"};
const face=(n,a="")=>brImg(n)?`<img src="${brImg(n)}" title="${esc(n)}" ${a}>`:`<span class="tag" style="cursor:pointer" ${a}>${esc(n)}</span>`;
const ic=(n,c="")=>brImg(n)?`<img class="ic ${c}" src="${brImg(n)}" alt="" loading="lazy">`:"";
const wr=(w,n)=>n?Math.round(100*w/n)+"%":"–";
const col=(w,n)=>!n?"m":w/n>=.55?"w":w/n<=.45?"l":"";
function agg(ms,fn,win=m=>m.win){const o={};ms.forEach(m=>fn(m).forEach(k=>{o[k]??={n:0,w:0};o[k].n++;if(win(m))o[k].w++}));return o}
const setWins=m=>Number.isFinite(Number(m.setsFor))?Number(m.setsFor):(m.win?1:0);
const setLosses=m=>Number.isFinite(Number(m.setsAgainst))?Number(m.setsAgainst):(m.win?0:1);
function aggSets(ms,fn){const o={};ms.forEach(m=>fn(m).forEach(k=>{o[k]??={n:0,w:0};const w=setWins(m),l=setLosses(m);o[k].n+=w+l;o[k].w+=w}));return o}
const teamGames=(series=T().matches||[])=>series.flatMap(s=>Array.isArray(s.games)?s.games.map((g,i)=>({...s.draft,...g,id:`${s.id}:${i}`,seriesId:s.id,date:s.date,rival:s.rival,event:s.event,setsFor:g.win?1:0,setsAgainst:g.win?0:1})): [s]);
const seriesScore=s=>Array.isArray(s.games)&&s.games.length?[s.games.filter(g=>g.win).length,s.games.filter(g=>!g.win).length]:[setWins(s),setLosses(s)];
const seriesWon=s=>{const [w,l]=seriesScore(s);return w>l};
const rows=o=>Object.entries(o).sort((a,b)=>b[1].n-a[1].n||b[1].w-a[1].w);
const byWinRate=o=>Object.entries(o).sort((a,b)=>(b[1].n?b[1].w/b[1].n:0)-(a[1].n?a[1].w/a[1].n:0)||b[1].n-a[1].n);

const FALLBACK="Shelly,Colt,Bull,Brock,El Primo,Barley,Poco,Rosa,Jessie,Dynamike,Tick,8-Bit,Rico,Darryl,Penny,Carl,Jacky,Gus,Bo,Emz,Stu,Piper,Pam,Frank,Bibi,Bea,Nani,Edgar,Griff,Grom,Bonnie,Gale,Colette,Belle,Ash,Lola,Sam,Mandy,Maisie,Hank,Pearl,Larry & Lawrie,Angelo,Berry,Shade,Mortis,Tara,Gene,Max,Mr. P,Sprout,Byron,Squeak,Spike,Crow,Leon,Sandy,Amber,Meg,Surge,Chester,Cordelius,Kit,Draco,Kenji,Kaze,Buzz,Fang,Eve,Janet,Otis,Buster,Gray,R-T,Willow,Doug,Chuck,Charlie,Mico,Melodie,Lily,Clancy,Moe,Juju,Ollie,Lumi,Finx,Jae-yong,Alli,Mina,Ziggy,Gigi,Glowbert,Sirius,Najia".split(",");
let ERR=[],ST={b:"cargando…",m:"cargando…"};
async function getJSON(path){
 const base="https://api.brawlapi.com"+path;
 for(const u of [base,"https://api.brawlify.com"+path,"https://corsproxy.io/?url="+encodeURIComponent(base),"https://api.allorigins.win/raw?url="+encodeURIComponent(base)]){
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);const r=await fetch(u,{signal:c.signal});clearTimeout(t);
   if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json(),l=Array.isArray(j)?j:j.list;if(Array.isArray(l)&&l.length)return l;throw new Error("respuesta vacía")}
  catch(e){ERR.push(u.slice(0,60)+" → "+(e.name==="AbortError"?"timeout":e.message))}}
 return null}
const useFallback=()=>{if(!BR.length)BR=FALLBACK.map(name=>({name,imageUrl:""})).sort((a,b)=>a.name.localeCompare(b.name))};
async function init(){
 try{
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),10000);
  const r=await fetch(SUPABASE_URL+"/rest/v1/app_data?key=eq.shared_state&select=value",{
   headers:syncHeaders(),signal:c.signal
  });
  clearTimeout(timer);
  if(!r.ok){setSyncStatus(r.status===404?"Tabla no configurada":`Error Supabase (${r.status})`);}
  else{
   const rows=await r.json();
   if(rows?.[0]?.value){
    S=rows[0].value;
    localStorage.setItem("bsa",JSON.stringify(S));
    setSyncStatus("Datos compartidos");
   }else{
    setSyncStatus("Guardado compartido");
    save();
   }
  }
 }catch(e){
  setSyncStatus(e.name==="AbortError"?"Sin respuesta de Supabase":"Local: sin conexión");
 }
 try{const c=JSON.parse(localStorage.getItem("bsa_api")||"null");if(c){BR=c.BR||[];MP=c.MP||[];ST={b:BR.length?"caché":"–",m:MP.length?"caché":"–"}}}catch(e){}
 useFallback();render();
 const[b,m]=await Promise.all([getJSON("/v1/brawlers"),getJSON("/v1/maps")]);
 if(b){BR=b.map(x=>({id:x.id,link:x.link,name:x.name,imageUrl:x.imageUrl,imageUrl2:x.imageUrl2,class:x.class,rarity:x.rarity,description:x.description,starPowers:x.starPowers,gadgets:x.gadgets,gears:x.gears})).sort((x,y)=>x.name.localeCompare(y.name));ST.b="ok ("+BR.length+")"}else{ST.b="falló";useFallback()}
 if(m){MP=m.map(x=>({name:x.name,imageUrl:x.imageUrl,gameMode:{name:x.gameMode?.name}}));ST.m="ok ("+MP.length+")"}else ST.m=MP.length?"caché":"falló";
 try{if(b||m)localStorage.setItem("bsa_api",JSON.stringify({BR:b?BR:BR.filter(x=>x.imageUrl),MP}))}catch(e){}
 render();
}
function render(){
 $("#ws").innerHTML=Object.entries(S.teams).map(([id,t])=>`<option value="${id}" ${id==S.active?"selected":""}>${esc(t.name)}</option>`).join("");
 const tb={partidos:"Partidos",analisis:"Análisis",rivales:"Rivales y bans",scouting:"Scouting",mapas:"Mapas",brawlers:"Brawlers"};
 $("#tabs").innerHTML=Object.entries(tb).map(([k,v])=>`<button class="${k==tab?"on":""}" data-t="${k}">${v}</button>`).join("");
 $("#view").innerHTML=({partidos:vMatches,analisis:vAnalysis,rivales:vRivals,scouting:vScouting,mapas:vMaps,brawlers:vBrawlers})[tab]();
 if(!BR.some(b=>b.imageUrl)||!MP.length)$("#view").insertAdjacentHTML("afterbegin",`<div class="card"><b class="l">Imágenes sin cargar</b> · brawlers: ${ST.b} · mapas: ${ST.m} <button data-retry>Reintentar</button>
 <span class="m">La web funciona igualmente (puedes escribir cualquier brawler en el buscador).</span>${ERR.length?`<details><summary class="m">Ver errores</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(ERR.join("\n"))}</pre></details>`:""}</div>`);
}
const chipsFrom=(source,f)=>`<div class="chips">${source[f].map((n,i)=>face(n,`data-rm="${f}:${i}"`)).join("")}${source[f].length<LIM[f]?`<button class="add" data-add="${f}">+</button>`:""}</div>`;
const chips=f=>chipsFrom(draft,f);
const scoutChips=f=>chipsFrom(scoutDraft,f);

function vMatches(){
 const t=T(),ms=[...t.matches].sort((a,b)=>b.date.localeCompare(a.date)||0);
 const rivals=[...new Set(t.matches.map(m=>m.rival))];
 const mapOpts=Object.keys(POOL).map(k=>{
  const names=[...(POOL[k]||[])].sort((a,b)=>a.localeCompare(b,"es"));
  return names.length?`<optgroup label="${ES[k]}">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</optgroup>`:"";
 }).join("");
 const history=ms.length?`<table><tr><th>Fecha</th><th>Rival</th><th>Liga/torneo</th><th>Marcador</th><th>Mapas y drafts</th><th></th></tr>${ms.map(m=>{

function vMaps(){

 ${BR.filter(b=>norm(b.name).includes(q)).map(b=>{const s=us[b.name];return `<button data-br="${esc(b.name)}" style="text-align:center">${b.imageUrl2||b.imageUrl?`<img class="ic l" src="${b.imageUrl2||b.imageUrl}" loading="lazy"><br>`:""}${esc(b.name)}<br><span class="m">${s?wr(s.w,s.n)+" ("+s.n+")":b.class?.name||""}</span></button>`}).join("")}</div></div>`;
}
function openOverlay(){
 const o=$("#ov");
 o.hidden=false;
 o.setAttribute("aria-modal","true");
 o.setAttribute("role","dialog");
 document.body.classList.add("modal-open");
 return o;
}
function closeOverlay(){
 const o=$("#ov");
 o.hidden=true;
 o.removeAttribute("aria-modal");
 o.removeAttribute("role");
 o.removeAttribute("data-f");
 document.body.classList.remove("modal-open");
}
function openBrawler(n){
 const b=brOf(n);if(!b)return;const bd=T().builds[n]||"";
 const li=(t,a)=>a?.length?`<h2 style="margin-top:12px">${t}</h2><div class="row">${a.map(x=>`<span class="tag">${x.imageUrl?`<img class="ic" src="${x.imageUrl}">`:""}${esc(x.name)}</span>`).join("")}</div>`:"";
 const recs=Object.values(S.teams).flatMap(team=>team.gearRecs?.[n]||[]);
 const gearCounts=Object.entries(recs.reduce((o,r)=>(o[r.gear]=(o[r.gear]||0)+1,o),{})).sort((a,b)=>b[1]-a[1]);
 const gearOptions=(b.gears||[]).map(g=>`<option value="${esc(g.name)}">${esc(g.name)}</option>`).join("");
 const recList=gearCounts.length?gearCounts.map(([gear,count])=>{
  const attributions=recs.filter(r=>r.gear===gear).map(r=>{const url=safeUrl(r.source);return `${esc(r.pro)} · ${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(r.source)} ↗</a>`:esc(r.source)}`}).join(", ");
  return `<div class="map-rank"><span>${esc(gear)}</span><b>${count} recomendación${count===1?"":"es"}</b></div><p class="m">${attributions}</p>`;
 }).join(""):`<p class="m">Aún no hay recomendaciones comunitarias documentadas para este brawler.</p>`;
 const brawlifyUrl=safeUrl(b.link)||"https://brawlify.com/brawlers/";
 const o=openOverlay();o.innerHTML=`<div><div class="row">${b.imageUrl2||b.imageUrl?`<img class="ic l" src="${b.imageUrl2||b.imageUrl}">`:""}<div><h2 style="margin:0">${esc(b.name)}</h2><span class="m">${esc(b.class?.name||"")} · ${esc(b.rarity?.name||"")}</span></div><span style="flex:1"></span><button data-close aria-label="Cerrar">✕</button></div>
 <p class="m">${esc(b.description||"")}</p>${li("Star Powers",b.starPowers)}${li("Gadgets",b.gadgets)}${li("Gears disponibles",b.gears)}
 <section class="card"><h2>Gears y fuentes de referencia</h2><p class="m">Consulta los datos y builds en estas fuentes. Las recomendaciones guardadas abajo son aportaciones atribuidas, no se importan automáticamente ni se presentan como verificadas.</p><div class="source-links"><a class="source-link" href="${esc(brawlifyUrl)}" target="_blank" rel="noopener noreferrer">Brawlify · ${esc(b.name)} ↗</a><a class="source-link" href="https://powerleagueprodigy.com/" target="_blank" rel="noopener noreferrer">PL Prodigy ↗</a></div>${recList}
 <div class="row"><select id="gear-choice">${gearOptions||'<option value="">Gear no disponible en API</option>'}</select><input id="gear-custom" placeholder="Gear (si no aparece en la lista)"><input id="gear-pro" placeholder="Pro player / equipo"><input id="gear-source" placeholder="URL de la recomendación"><button class="p" data-gear-add="${esc(n)}">Añadir recomendación</button></div></section>
 <h2 style="margin-top:14px">Mi build recomendada (nota del equipo)</h2><textarea id="bd" rows="4" style="width:100%" placeholder="Ej: Star Power 2 · Gadget 1 · Gears: Velocidad + Escudo">${esc(bd)}</textarea>
 <div class="row" style="margin-top:8px"><button class="p" data-sb="${esc(n)}">Guardar build</button></div></div>`;
}
function openPicker(f){
 const o=openOverlay();
 const source=f.startsWith("scout")?scoutDraft:draft;
 const draw=q=>{const L=BR.filter(b=>norm(b.name).includes(norm(q))&&!source[f].includes(b.name));
  $("#pg").innerHTML=L.map(b=>`<button data-pick="${esc(b.name)}">${b.imageUrl2||b.imageUrl?`<img src="${b.imageUrl2||b.imageUrl}" loading="lazy"><br>`:""}${esc(b.name)}</button>`).join("")+(q.trim()&&!BR.some(b=>norm(b.name)===norm(q))?`<button data-pick="${esc(q.trim())}">➕ Añadir «${esc(q.trim())}»</button>`:"")};
 o.innerHTML=`<div><div class="row"><input id="ps" placeholder="Buscar…" style="flex:1"><button data-close aria-label="Cerrar">✕</button></div><div id="pg" class="bg" style="margin-top:10px"></div></div>`;
 draw("");$("#ps").oninput=e=>draw(e.target.value);$("#ps").focus();o.dataset.f=f;
}
document.addEventListener("click",e=>{
 const d=e.target.closest("[data-pick],[data-br],[data-map],[data-map-back],[data-map-print],[data-t],[data-add],[data-rm],[data-close],[data-gear-add],[data-sb],[data-del],[data-scout-draft-del],[data-scout-del],[data-retry],#f-save,#scout-add-draft,#scout-save-series");if(!d)return;const D=d.dataset;
 if(D.t){tab=D.t;render()}
 else if("mapBack" in D){selectedMap="";render()}
 else if("mapPrint" in D)window.print()
 else if(D.map){selectedMap=D.map;render()}
 else if("retry" in D){ERR=[];ST={b:"cargando…",m:"cargando…"};init()}
 else if(D.add)openPicker(D.add);
 else if(D.rm){const[f,i]=D.rm.split(":");(f.startsWith("scout")?scoutDraft:draft)[f].splice(+i,1);keep()}
 else if(D.pick){const f=$("#ov").dataset.f;(f.startsWith("scout")?scoutDraft:draft)[f].push(D.pick);closeOverlay();keep()}
 else if("close" in D)closeOverlay();
 else if(D.br)openBrawler(D.br);
 else if(D.gearAdd){
  const gear=$("#gear-choice").value||$("#gear-custom").value.trim(),pro=$("#gear-pro").value.trim(),source=$("#gear-source").value.trim();
  if(!gear||!pro||!source)return alert("Indica el gear, el pro/equipo y una fuente.");
  T().gearRecs??={};T().gearRecs[D.gearAdd]??=[];
  T().gearRecs[D.gearAdd].push({gear,pro,source});
  save();openBrawler(D.gearAdd);
 }
 else if(D.sb){T().builds[D.sb]=$("#bd").value;save();closeOverlay()}
 else if("scoutDraftDel" in D){scoutPending.splice(+D.scoutDraftDel,1);keep()}
 else if(d.id==="scout-add-draft"){
  captureScoutForm();
  const map=$("#sc-map").value;
  scoutPending.push({map,mode:modeOf(map),teamWin:$("#sc-result").value==="1",teamPicks:[...scoutDraft.scoutMine],opponentPicks:[...scoutDraft.scoutTheirs],teamBans:[...scoutDraft.scoutMyBans],opponentBans:[...scoutDraft.scoutTheirBans]});
  scoutDraft={scoutMine:[],scoutTheirs:[],scoutMyBans:[],scoutTheirBans:[]};
  keep();
 }
 else if(d.id==="scout-save-series"){
  captureScoutForm();
  if(!scoutForm.team.trim()||!scoutForm.opponent.trim())return alert("Indica el equipo analizado y su rival.");
  if(!scoutPending.length)return alert("Añade al menos un set/draft a la serie.");
  const wins=scoutPending.filter(g=>g.teamWin).length,losses=scoutPending.length-wins;
  if(wins===losses)return alert("La serie está empatada: añade los sets restantes antes de guardarla.");
  T().scouting??=[];
  T().scouting.push({id:uid(),date:scoutForm.date, event:scoutForm.event.trim(),team:scoutForm.team.trim(),opponent:scoutForm.opponent.trim(),drafts:JSON.parse(JSON.stringify(scoutPending))});
  scoutTeamFilter=scoutForm.team.trim();
  scoutPending=[];scoutDraft={scoutMine:[],scoutTheirs:[],scoutMyBans:[],scoutTheirBans:[]};
  scoutForm={date:new Date().toISOString().slice(0,10),event:"",team:scoutForm.team,opponent:"",map:POOL.Bounty[0],result:"1"};
  save();render();
 }
 else if(D.scoutDel){if(confirm("¿Eliminar esta serie observada?")){T().scouting=(T().scouting||[]).filter(s=>s.id!==D.scoutDel);save();render()}}
 else if(D.del){if(confirm("¿Borrar este partido?")){T().matches=T().matches.filter(m=>m.id!==D.del);save();render()}}
 else if(d.id==="f-save"){
  const rival=$("#f-rival").value.trim();
  if(!rival)return alert("Indica el equipo rival.");
  const map=$("#f-map").value;
  if(!map)return alert("Selecciona el mapa del draft.");
  if(draft.mine.length!==LIM.mine||draft.theirs.length!==LIM.theirs)return alert("Completa los tres picks de tu equipo y los tres del rival.");
  const [setsFor,setsAgainst]=$("#f-score").value.split("-").map(Number);
  const sharedDraft={map,mode:modeOf(map),mine:[...draft.mine],theirs:[...draft.theirs],myBans:[...draft.myBans],theirBans:[...draft.theirBans]};
  const games=[...Array(setsFor).fill(true),...Array(setsAgainst).fill(false)].map(win=>({win}));
  T().matches.push({id:uid(),date:$("#f-date").value,rival,event:$("#f-event").value.trim(),setsFor,setsAgainst,win:setsFor>setsAgainst,notes:$("#f-notes").value,draft:sharedDraft,games});
  draft={mine:[],theirs:[],myBans:[],theirBans:[]};save();render()
 }
});
function captureScoutForm(){
 if($("#sc-date"))Object.assign(scoutForm,{date:$("#sc-date").value,event:$("#sc-event").value,team:$("#sc-team").value,opponent:$("#sc-opponent").value,map:$("#sc-map").value,result:$("#sc-result").value});
}
function keep(){const v={d:$("#f-date")?.value,r:$("#f-rival")?.value,m:$("#f-map")?.value,event:$("#f-event")?.value,score:$("#f-score")?.value,notes:$("#f-notes")?.value,bans:$("#f-bans")?.open};captureScoutForm();render();
 if($("#f-date")){$("#f-date").value=v.d;$("#f-rival").value=v.r;$("#f-map").value=v.m;$("#f-event").value=v.event;$("#f-score").value=v.score;$("#f-notes").value=v.notes;$("#f-bans").open=v.bans}}
document.addEventListener("change",e=>{
 if(e.target.id==="rsel"){rivalSel=e.target.value;render()}
 if(e.target.id==="mfilter"){mapFilter=e.target.value;render()}
 if(e.target.id==="scout-team-filter"){scoutTeamFilter=e.target.value;render()}
 if(e.target.id==="sc-map")scoutForm.map=e.target.value;
 if(e.target.id==="sc-result")scoutForm.result=e.target.value;
});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeOverlay()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden)closeOverlay()});
document.addEventListener("input",e=>{
 if(e.target.id==="bq"){bq=e.target.value;const p=e.target.selectionStart;render();const i=$("#bq");i.focus();i.setSelectionRange(p,p)}
 if(e.target.id==="sc-date")scoutForm.date=e.target.value;
 if(e.target.id==="sc-event")scoutForm.event=e.target.value;
 if(e.target.id==="sc-team")scoutForm.team=e.target.value;
 if(e.target.id==="sc-opponent")scoutForm.opponent=e.target.value;
});
$("#ws").onchange=e=>{S.active=e.target.value;rivalSel="";selectedMap="";draft={mine:[],theirs:[],myBans:[],theirBans:[]};scoutPending=[];scoutDraft={scoutMine:[],scoutTheirs:[],scoutMyBans:[],scoutTheirBans:[]};scoutTeamFilter="";scoutForm={date:new Date().toISOString().slice(0,10),event:"",team:"",opponent:"",map:POOL.Bounty[0],result:"1"};save();render()};
$("#nw").onclick=()=>{const n=prompt("Nombre del nuevo equipo / web:");if(!n)return;const id=uid();S.teams[id]={name:n,matches:[],builds:{}};S.active=id;save();render()};
$("#rn").onclick=()=>{const n=prompt("Nuevo nombre:",T().name);if(n){T().name=n;save();render()}};
$("#dl").onclick=()=>{if(Object.keys(S.teams).length<2)return alert("Debe existir al menos un equipo");if(confirm(`¿Eliminar "${T().name}" y todos sus partidos?`)){delete S.teams[S.active];S.active=Object.keys(S.teams)[0];draft={mine:[],theirs:[],myBans:[],theirBans:[]};scoutPending=[];scoutDraft={scoutMine:[],scoutTheirs:[],scoutMyBans:[],scoutTheirBans:[]};scoutTeamFilter="";scoutForm={date:new Date().toISOString().slice(0,10),event:"",team:"",opponent:"",map:POOL.Bounty[0],result:"1"};save();render()}};
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="bs-analyst-backup.json";a.click()};
$("#im").onclick=()=>$("#fi").click();
$("#fi").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.teams)throw 0;if(confirm("Esto reemplaza los datos actuales. ¿Continuar?")){S=d;save();render()}}catch{alert("Archivo no válido")}};
render();init();
</script></body></html>
